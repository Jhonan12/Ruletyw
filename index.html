<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ruleta Europea - Accesos y Análisis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    input, select, textarea {
      padding: 8px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      margin: 5px 0;
      background-color: #222;
      color: white;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      background-color: #28a745;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #218838;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-content {
      border: 1px solid #333;
      padding: 15px;
      border-radius: 5px;
      background-color: #1e1e1e;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    .logout {
      float: right;
      margin-top: -30px;
    }

    .info {
      margin: 15px 0;
      font-size: 15px;
      color: #aaa;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
    }
    .inline-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
    }
    th, td {
      border: 1px solid #555;
      padding: 6px 8px;
    }
    th {
      background-color: #444;
    }
    .numero-btn {
      border: none;
      font-weight: bold;
      cursor: pointer;
      width: 40px;
      height: 30px;
      font-size: 16px;
      border-radius: 4px;
      transition: filter 0.3s;
      color: white;
      user-select: none;
    }
    .numero-btn:hover {
      filter: brightness(1.2);
    }
    .btn-rojo {
      background-color: #d64040;
      box-shadow: 0 0 6px #d64040aa;
    }
    .btn-negro {
      background-color: #2e2e2e;
      box-shadow: 0 0 6px #222222cc;
      color: #ddd;
    }
    .btn-verde {
      background-color: #4caf50;
      box-shadow: 0 0 6px #4caf50cc;
    }
    .progress-container {
      width: 100%;
      height: 25px;
      background-color: #333;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: 0 0 8px rgba(144, 238, 144, 0.7);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #a4ffb3, #7ee08a);
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px #a4ffb3, 0 0 15px #7ee08a;
    }
    .progress-text {
      margin-bottom: 8px;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }
    .probabilidad-color {
      margin-top: 15px;
      font-size: 18px;
      background-color: #222;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 0 8px #28a745cc;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      white-space: pre-line;
    }
  </style>
</head>
<body>

<!-- Pantalla Login -->
<div id="loginScreen">
  <h1>🎰 Iniciar sesión</h1>
  <label>Usuario:</label>
  <input type="text" id="loginUsuario" placeholder="Usuario" autocomplete="username"/>
  <label>Clave:</label>
  <input type="password" id="loginClave" placeholder="Clave" autocomplete="current-password"/>
  <br />
  <button onclick="iniciarSesion()">Ingresar</button>
</div>

<!-- Pantalla App -->
<div id="appScreen" class="hidden">
  <h1>🎯 Panel Ruleta Europea</h1>
  <div class="logout">
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
  <div class="tab-buttons">
    <button onclick="mostrarTab('principal')">Principal</button>
    <button id="btnAccesos" onclick="mostrarTab('accesos')" class="hidden">Accesos</button>
  </div>

  <!-- PRINCIPAL -->
  <div id="tabPrincipal" class="tab-content">
    <h2>Principal</h2>
    <p><strong>Historial (números separados por coma):</strong></p>
    <textarea id="historialInput" placeholder="Ejemplo: 0,32,15,19,8,22,5,..." oninput="procesarHistorial()"></textarea>
    
    <div class="progress-text" id="precisionText">Cantidad de números: 0 | Precisión: N/A | 0%</div>
    <div class="progress-container" aria-label="Barra de progreso de precisión">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="inline-group">
      <label for="guardarSlot">Guardar en slot:</label>
      <select id="guardarSlot">
        <!-- Se llenará dinámicamente -->
      </select>
      <button onclick="guardarHistorial()">Guardar Historial</button>
    </div>
    <div class="inline-group">
      <label for="cargarSlot">Cargar slot:</label>
      <select id="cargarSlot">
        <!-- Se llenará dinámicamente -->
      </select>
      <button onclick="cargarHistorial()">Cargar Historial</button>
      <button onclick="borrarHistorial()">Borrar Historial</button>
    </div>
    <button onclick="procesarHistorial()">Procesar Historial</button>

    <div class="section">
      <p><strong>Generar tabla números 0 a 36 (haz clic en un número para ver probabilidad de próximo color rojo o negro y las 2 docenas más probables):</strong></p>
      <button id="btnGenerarEstudio" onclick="generarEstudio()" disabled>Generar Tabla</button>
    </div>

    <div class="resultado" id="resultado" role="region" aria-live="polite"></div>
    <div id="probabilidadColor" class="probabilidad-color" aria-live="polite" role="region" style="display:none;"></div>
  </div>

  <!-- ACCESOS -->
  <div id="tabAccesos" class="tab-content hidden">
    <h2>Gestión de usuarios</h2>
    <label>Nuevo usuario:</label>
    <input type="text" id="nuevoUsuario" placeholder="Nombre de usuario" />
    <label>Clave:</label>
    <input type="password" id="nuevaClave" placeholder="Clave" />
    <label>Tipo:</label>
    <select id="nuevoTipo">
      <option value="admin">Admin</option>
      <option value="estandar">Estándar</option>
    </select>
    <label>Cantidad de historiales permitidos (1 a 3):</label>
    <select id="nuevoMaxHistoriales">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
    </select>
    <label>Duración de la cuenta:</label>
    <div style="display:flex; gap:10px; align-items:center;">
      <input type="number" id="nuevoDuracionCantidad" min="1" value="1" style="width:70px;" />
      <select id="nuevoDuracionTipo">
        <option value="dias">Días</option>
        <option value="semanas">Semanas</option>
        <option value="meses">Meses</option>
      </select>
    </div>
    <button onclick="crearUsuario()">Crear usuario</button>

    <div class="info" id="listaUsuarios"></div>
  </div>
</div>

<script>
  // --- Login y Gestión de Usuarios ---
  const defaultUser = {
    usuario: 'admin',
    clave: 'admin123',
    tipo: 'admin',
    maxHistoriales: 3,
    duracionCantidad: 9999,
    duracionTipo: "dias",
    fechaExpiracion: new Date(Date.now() + 9999*24*60*60*1000).toISOString()
  };

  if (!localStorage.getItem("usuarios_ruleta")) {
    localStorage.setItem("usuarios_ruleta", JSON.stringify([defaultUser]));
  }

  function iniciarSesion() {
    const user = document.getElementById("loginUsuario").value.trim();
    const clave = document.getElementById("loginClave").value.trim();

    const usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];
    const encontrado = usuarios.find(u => u.usuario === user && u.clave === clave);

    if (!encontrado) {
      alert("Usuario o clave incorrectos");
      return;
    }

    // Verificar expiración de usuario
    const ahora = new Date();
    const fechaExp = new Date(encontrado.fechaExpiracion);
    if (fechaExp < ahora) {
      alert("La cuenta de este usuario ha expirado.");
      return;
    }

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");

    if (encontrado.tipo === "admin") {
      document.getElementById("btnAccesos").classList.remove("hidden");
      document.getElementById("tabAccesos").classList.remove("hidden");
    } else {
      document.getElementById("btnAccesos").classList.add("hidden");
      document.getElementById("tabAccesos").classList.add("hidden");
    }

    sessionStorage.setItem("usuarioActual", encontrado.usuario);
    sessionStorage.setItem("tipoUsuario", encontrado.tipo);

    actualizarSlotsPermitidos();

    cargarHistorialUsuario();

    mostrarTab('principal');
    mostrarListaUsuarios();
  }

  function cerrarSesion() {
    sessionStorage.clear();
    document.getElementById("appScreen").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("loginUsuario").value = "";
    document.getElementById("loginClave").value = "";
    historial = [];
    document.getElementById("historialInput").value = "";
    actualizarBarraProgreso(0);
    document.getElementById("btnGenerarEstudio").disabled = true;
    mostrarResultado("");
    document.getElementById("probabilidadColor").style.display = "none";
  }

  function mostrarTab(tab) {
    document.getElementById("tabPrincipal").classList.add("hidden");
    document.getElementById("tabAccesos").classList.add("hidden");

    if (tab === 'principal') {
      document.getElementById("tabPrincipal").classList.remove("hidden");
    } else if (tab === 'accesos') {
      document.getElementById("tabAccesos").classList.remove("hidden");
    }
  }

  function crearUsuario() {
    const nuevoUsuario = document.getElementById("nuevoUsuario").value.trim();
    const nuevaClave = document.getElementById("nuevaClave").value.trim();
    const nuevoTipo = document.getElementById("nuevoTipo").value;
    const maxHistoriales = parseInt(document.getElementById("nuevoMaxHistoriales").value, 10);

    const duracionCantidad = parseInt(document.getElementById("nuevoDuracionCantidad").value, 10);
    const duracionTipo = document.getElementById("nuevoDuracionTipo").value;

    if (!nuevoUsuario || !nuevaClave) {
      alert("Debes ingresar usuario y clave");
      return;
    }

    if (maxHistoriales < 1 || maxHistoriales > 3) {
      alert("La cantidad de historiales permitidos debe ser entre 1 y 3");
      return;
    }

    if (isNaN(duracionCantidad) || duracionCantidad < 1) {
      alert("La duración debe ser un número mayor o igual a 1");
      return;
    }

    let usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];

    if (usuarios.some(u => u.usuario === nuevoUsuario)) {
      alert("Este usuario ya existe.");
      return;
    }

    // Calcular fecha de expiración
    const ahora = new Date();
    let duracionMs = 0;
    if (duracionTipo === "dias") duracionMs = duracionCantidad * 24 * 60 * 60 * 1000;
    else if (duracionTipo === "semanas") duracionMs = duracionCantidad * 7 * 24 * 60 * 60 * 1000;
    else if (duracionTipo === "meses") duracionMs = duracionCantidad * 30 * 24 * 60 * 60 * 1000;

    const fechaExpiracion = new Date(ahora.getTime() + duracionMs).toISOString();

    usuarios.push({ 
      usuario: nuevoUsuario, 
      clave: nuevaClave, 
      tipo: nuevoTipo,
      maxHistoriales: maxHistoriales,
      duracionCantidad: duracionCantidad,
      duracionTipo: duracionTipo,
      fechaExpiracion: fechaExpiracion
    });
    localStorage.setItem("usuarios_ruleta", JSON.stringify(usuarios));

    alert("Usuario creado correctamente.");
    document.getElementById("nuevoUsuario").value = "";
    document.getElementById("nuevaClave").value = "";
    document.getElementById("nuevoDuracionCantidad").value = 1;
    document.getElementById("nuevoDuracionTipo").value = "dias";
    mostrarListaUsuarios();
  }

  function mostrarListaUsuarios() {
    const usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];
    const actual = sessionStorage.getItem("tipoUsuario");

    if (actual !== "admin") return;

    let html = "<h3>Usuarios registrados:</h3><ul>";
    usuarios.forEach((u, index) => {
      const maxH = u.maxHistoriales || 3;
      html += `<li>
        <strong>${u.usuario}</strong> (${u.tipo}) - Historiales permitidos: ${maxH} - Duración: ${u.duracionCantidad} ${u.duracionTipo}
        <button style="margin-left:15px; color:#ff4d4d; background:none; border:none; cursor:pointer;" onclick="borrarUsuario(${index})" title="Borrar usuario">🗑️</button>
      </li>`;
    });
    html += "</ul>";
    document.getElementById("listaUsuarios").innerHTML = html;
  }

  function borrarUsuario(indice) {
    if(!confirm("¿Seguro que quieres borrar este usuario?")) return;

    let usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];
    const usuarioActual = sessionStorage.getItem("usuarioActual");

    if (usuarios[indice].usuario === usuarioActual) {
      alert("No puedes borrar el usuario con el que estás logueado.");
      return;
    }

    usuarios.splice(indice, 1);
    localStorage.setItem("usuarios_ruleta", JSON.stringify(usuarios));
    mostrarListaUsuarios();
  }

  // --- Funciones de la pestaña principal ---
  const MAX_DATOS = 10000;
  let historial = [];

  const rojos = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const negros = new Set([2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35]);

  function obtenerDocena(numero) {
    if (numero >= 1 && numero <= 12) return 1;
    if (numero >= 13 && numero <= 24) return 2;
    if (numero >= 25 && numero <= 36) return 3;
    return 0;
  }

  function actualizarBarraProgreso(cantidad) {
    const progressBar = document.getElementById("progressBar");
    const precisionText = document.getElementById("precisionText");

    let porcentaje = Math.min((cantidad / MAX_DATOS) * 100, 100);
    progressBar.style.width = porcentaje + "%";

    let nivel = "N/A";
    if (cantidad >= 100 && cantidad <= 1500) nivel = "Bajo";
    else if (cantidad >= 1501 && cantidad <= 5000) nivel = "Medio";
    else if (cantidad >= 5001 && cantidad <= 10000) nivel = "Alto";
    else if (cantidad < 100) nivel = "Muy bajo";

    precisionText.textContent = `Cantidad de números: ${cantidad} | Precisión: ${nivel} | ${porcentaje.toFixed(2)}%`;
  }

  function mostrarResultado(texto) {
    const res = document.getElementById("resultado");
    res.innerHTML = texto;
  }

  function procesarHistorial() {
    const input = document.getElementById("historialInput").value;
    const arr = input.split(",").map(x => x.trim()).filter(x => x !== "");

    const numerosValidos = [];
    for (let n of arr) {
      let num = parseInt(n, 10);
      if (!isNaN(num) && num >= 0 && num <= 36) {
        numerosValidos.push(num);
      }
    }

    historial = numerosValidos;
    actualizarBarraProgreso(historial.length);

    // Habilitar el botón de generar tabla si hay suficientes datos
    document.getElementById("btnGenerarEstudio").disabled = historial.length < 100;

    mostrarResultado("");
    document.getElementById("probabilidadColor").style.display = "none";
  }

  // Función para guardar historial en un slot según usuario y limite permitido
  function actualizarSlotsPermitidos() {
    const tipoUsuario = sessionStorage.getItem("tipoUsuario");
    const usuarioActual = sessionStorage.getItem("usuarioActual");
    const usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];
    let maxSlots = 3; // default

    const usuarioObj = usuarios.find(u => u.usuario === usuarioActual);
    if (usuarioObj && usuarioObj.maxHistoriales) {
      maxSlots = usuarioObj.maxHistoriales;
    }

    // Rellenar select guardar y cargar con slots permitidos
    const guardarSelect = document.getElementById("guardarSlot");
    const cargarSelect = document.getElementById("cargarSlot");
    guardarSelect.innerHTML = "";
    cargarSelect.innerHTML = "";

    for (let i = 1; i <= maxSlots; i++) {
      guardarSelect.innerHTML += `<option value="${i}">Slot ${i}</option>`;
      cargarSelect.innerHTML += `<option value="${i}">Slot ${i}</option>`;
    }
  }

  function guardarHistorial() {
    const usuario = sessionStorage.getItem("usuarioActual");
    const slot = document.getElementById("guardarSlot").value;
    if (!usuario || !slot) {
      alert("Error al guardar historial: usuario o slot no válido.");
      return;
    }

    // Guardar historial por usuario y slot en localStorage
    const key = `historial_${usuario}_slot${slot}`;
    localStorage.setItem(key, JSON.stringify(historial));
    alert(`Historial guardado en slot ${slot}`);
  }

  function cargarHistorial() {
    const usuario = sessionStorage.getItem("usuarioActual");
    const slot = document.getElementById("cargarSlot").value;
    if (!usuario || !slot) {
      alert("Error al cargar historial: usuario o slot no válido.");
      return;
    }

    const key = `historial_${usuario}_slot${slot}`;
    const guardado = localStorage.getItem(key);

    if (!guardado) {
      alert("No hay historial guardado en ese slot.");
      return;
    }

    historial = JSON.parse(guardado);
    document.getElementById("historialInput").value = historial.join(",");
    actualizarBarraProgreso(historial.length);
    document.getElementById("btnGenerarEstudio").disabled = historial.length < 100;

    mostrarResultado("");
    document.getElementById("probabilidadColor").style.display = "none";
  }

  function borrarHistorial() {
    const usuario = sessionStorage.getItem("usuarioActual");
    const slot = document.getElementById("cargarSlot").value;
    if (!usuario || !slot) {
      alert("Error al borrar historial: usuario o slot no válido.");
      return;
    }

    if (!confirm(`¿Seguro que quieres borrar el historial del slot ${slot}?`)) return;

    const key = `historial_${usuario}_slot${slot}`;
    localStorage.removeItem(key);

    // Si el slot está cargado, limpiar textarea
    const guardado = localStorage.getItem(key);
    if (!guardado) {
      if (document.getElementById("cargarSlot").value === slot) {
        historial = [];
        document.getElementById("historialInput").value = "";
        actualizarBarraProgreso(0);
        document.getElementById("btnGenerarEstudio").disabled = true;
        mostrarResultado("");
        document.getElementById("probabilidadColor").style.display = "none";
      }
    }

    alert(`Historial borrado del slot ${slot}`);
  }

  function cargarHistorialUsuario() {
    // Al iniciar sesión cargamos el primer slot guardado (si existe)
    const usuario = sessionStorage.getItem("usuarioActual");
    const maxHist = (() => {
      const usuarios = JSON.parse(localStorage.getItem("usuarios_ruleta")) || [];
      const u = usuarios.find(x => x.usuario === usuario);
      return u ? u.maxHistoriales : 3;
    })();

    actualizarSlotsPermitidos();

    for(let i = 1; i <= maxHist; i++) {
      const key = `historial_${usuario}_slot${i}`;
      const h = localStorage.getItem(key);
      if(h) {
        historial = JSON.parse(h);
        document.getElementById("historialInput").value = historial.join(",");
        actualizarBarraProgreso(historial.length);
        document.getElementById("btnGenerarEstudio").disabled = historial.length < 100;
        break;
      }
    }
  }

  // Genera la tabla de números con estilos según color
  function generarEstudio() {
    if (historial.length < 100) {
      alert("Necesitas al menos 100 números en el historial para generar el estudio.");
      return;
    }

    // Contar ocurrencias de cada número
    let conteo = {};
    for (let i = 0; i <= 36; i++) {
      conteo[i] = 0;
    }
    for (let n of historial) {
      if (n in conteo) conteo[n]++;
    }

    // Crear tabla HTML
    let tablaHTML = '<table role="grid" aria-label="Tabla de números y sus conteos"><thead><tr><th>Número</th><th>Veces</th></tr></thead><tbody>';
    for(let i=0; i<=36; i++) {
      let claseColor = '';
      if (rojos.has(i)) claseColor = 'btn-rojo';
      else if (negros.has(i)) claseColor = 'btn-negro';
      else claseColor = 'btn-verde'; // 0 verde

      tablaHTML += `<tr>
        <td><button class="numero-btn ${claseColor}" onclick="mostrarProbabilidad(${i})" aria-label="Número ${i}">${i}</button></td>
        <td>${conteo[i]}</td>
      </tr>`;
    }
    tablaHTML += '</tbody></table>';

    mostrarResultado(tablaHTML);
    document.getElementById("probabilidadColor").style.display = "none";
  }

  // Muestra probabilidad de próximo color para un número seleccionado
  function mostrarProbabilidad(numero) {
    if (historial.length < 100) {
      alert("Necesitas al menos 100 números en el historial para analizar.");
      return;
    }

    // Para análisis simple: se calcula la frecuencia del color que sigue al número seleccionado en el historial
    // (Este método es ilustrativo, puede mejorarse)

    // Buscar posiciones del número en historial
    let indices = [];
    for (let i = 0; i < historial.length - 1; i++) {
      if (historial[i] === numero) {
        indices.push(i);
      }
    }

    if (indices.length === 0) {
      alert("El número seleccionado no tiene ocurrencias suficientes para analizar.");
      return;
    }

    // Contar siguiente color
    let siguientesColores = { rojo: 0, negro: 0, verde: 0 };

    for (let idx of indices) {
      let siguiente = historial[idx + 1];
      if (rojos.has(siguiente)) siguientesColores.rojo++;
      else if (negros.has(siguiente)) siguientesColores.negro++;
      else if (siguiente === 0) siguientesColores.verde++;
    }

    // Calcular total y porcentajes
    const total = siguientesColores.rojo + siguientesColores.negro + siguientesColores.verde;
    const rojoPct = ((siguientesColores.rojo / total) * 100).toFixed(2);
    const negroPct = ((siguientesColores.negro / total) * 100).toFixed(2);
    const verdePct = ((siguientesColores.verde / total) * 100).toFixed(2);

    // Análisis de docenas más probables (las 2 docenas con mayor frecuencia)
    let docenaCount = {1:0, 2:0, 3:0};
    for (let n of historial) {
      const d = obtenerDocena(n);
      if(d) docenaCount[d]++;
    }
    // Ordenar docenas
    let docenasOrdenadas = Object.entries(docenaCount).sort((a,b) => b[1] - a[1]);
    const docena1 = docenasOrdenadas[0][0];
    const docena2 = docenasOrdenadas[1][0];

    // Texto para mostrar
    const texto = `Análisis para el número ${numero}:
Probabilidad de próximo color:
  🔴 Rojo: ${rojoPct}%
  ⚫ Negro: ${negroPct}%
  🟢 Verde (0): ${verdePct}%

Las 2 docenas más frecuentes en el historial son:
  Docena ${docena1} y Docena ${docena2}`;

    const probDiv = document.getElementById("probabilidadColor");
    probDiv.textContent = texto;
    probDiv.style.display = "block";
  }

  // Al cargar la página, mostrar login y limpiar
  window.onload = () => {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appScreen").classList.add("hidden");
  };
</script>
</body>
</html>
